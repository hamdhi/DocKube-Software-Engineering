name: Build Python Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'DockKubeDesktop/**'
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest 
    
    defaults:
      run:
        working-directory: ./DockKubeDesktop
    
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Build Windows Executable
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed app.py
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          # We must manually specify the folder path here for the plugin
          files: DockKubeDesktop/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
