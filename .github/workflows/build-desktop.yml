name: Publish Local Desktop Build

on:
  push:
    branches:
      - main
    paths:
      # Tells GitHub to run ONLY when the .exe inside the dist folder is updated
      - 'DockKubeDesktop/dist/DocKube.exe'
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest 
    
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          # Grabs the local .exe from the dist folder and attaches it
          files: DockKubeDesktop/dist/DocKube.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
