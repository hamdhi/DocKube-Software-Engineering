name: Publish Local Desktop Build

on:
  push:
    branches:
      - main
    paths:
      # This triggers the workflow if ANY .exe file is pushed anywhere
      - '**/*.exe'
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest 
    
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          # Scans the whole repo and uploads every .exe it finds
          files: "**/*.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
