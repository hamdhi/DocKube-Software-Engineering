name: Build Python Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'DockKubeDesktop/**'
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest 
    
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Build Windows Executable
        run: |
          pip install pyinstaller
          
          # Force the terminal into the correct folder before running
          cd DockKubeDesktop
          
          # Print the files in the folder just to double-check the server sees them
          dir
          
          # Run the build
          pyinstaller DockKube.spec
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          files: DockKubeDesktop/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
