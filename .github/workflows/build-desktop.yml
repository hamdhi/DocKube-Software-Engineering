name: Publish Local Desktop Build

on:
  push:
    branches:
      - main
    paths:
      # This triggers the workflow if ANY .exe file is pushed anywhere
      - '**/*.exe'
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest 
    
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      # The app reads this line to tell whether the published build is newer
      # than the one running, so it has to stay in step with app_update.py.
      - name: Read the app version
        run: |
          VERSION=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' DockKubeDesktop/app_update.py)
          if [ -z "$VERSION" ]; then
            echo "Could not read APP_VERSION from DockKubeDesktop/app_update.py" >&2
            exit 1
          fi
          echo "Publishing DocKube-Desktop v$VERSION"
          echo "DocKube-Desktop v$VERSION" > release_body.txt

      - name: Package the application
        run: |
          cd DockKubeDesktop/dist
          # One zip, not a thousand separate assets. The application is a
          # folder, so publishing it as a folder would attach every library
          # to the release individually and the updater would have no single
          # artifact to download.
          zip -qr dockeybe.zip DocKube -x '*.DS_Store'
          ls -lh dockeybe.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          body_path: release_body.txt
          # The zipped bundle. It has to be committed for this workflow to find
          # it, the same as the exe was before the build became a folder.
          files: DockKubeDesktop/dist/dockeybe.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
