name: Build Python Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'DockKubeDesktop/**'
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest 
    
    # Grant permissions to upload to GitHub Releases
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Build Windows Executable
        working-directory: ./DockKubeDesktop
        run: |
          pip install pyinstaller
          # Build the app using your existing spec file instead of a generic command
          pyinstaller DockKube.spec
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          # PyInstaller puts the finished .exe inside the 'dist' folder
          files: DockKubeDesktop/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
