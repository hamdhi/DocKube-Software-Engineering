name: Build and Publish the Desktop App

on:
  push:
    branches:
      - main
    paths:
      # Any source change to the desktop app, or a change to how it is built.
      - 'DockKubeDesktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  publish:
    # A Windows runner, because both halves of this build are Windows tools:
    # PyInstaller produces the executable and Inno Setup produces the installer.
    # Running Inno Setup under wine on Linux is possible and unreliable.
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter
          choco install innosetup --no-progress -y

      # The app reads this line to tell whether the published build is newer
      # than the one running, so it has to stay in step with app_update.py.
      - name: Stamp the release body
        shell: pwsh
        run: |
          $version = (Select-String -Path DockKubeDesktop/app_update.py -Pattern '^APP_VERSION = "(.*)"').Matches.Groups[1].Value
          if (-not $version) { throw "Could not read APP_VERSION" }
          "DocKube-Desktop v$version" | Out-File -FilePath release_body.txt -Encoding utf8
          Write-Output "Publishing DocKube-Desktop v$version"

      - name: Build the application and the installer
        working-directory: DockKubeDesktop
        shell: pwsh
        run: |
          python build_installer.py

      # One zip, not a thousand separate assets. The application is a folder,
      # so publishing it as a folder would attach every library to the release
      # individually and the updater would have no single artifact to download.
      - name: Zip the application for in-app updates
        shell: pwsh
        run: |
          Compress-Archive -Path DockKubeDesktop/dist/DocKube -DestinationPath DockKubeDesktop/dist/dockeybe.zip -Force
          Get-ChildItem DockKubeDesktop/dist | Select-Object Name, Length

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          body_path: release_body.txt
          # The installer exe is the PRIMARY artifact. When the user clicks
          # Update in the desktop app, it downloads DocKubeSetup.exe and runs
          # it silently (/VERYSILENT /NORESTART). The zip is a fallback for
          # in-app hot-swap updates if the installer download fails.
          # DocKubeSetup.exe MUST be listed FIRST so the updater picks it up.
          files: |
            DockKubeDesktop/dist/DocKubeSetup.exe
            DockKubeDesktop/dist/dockeybe.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
