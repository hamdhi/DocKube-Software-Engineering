name: Build Python Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'DockKubeDesktop/**'
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest 
    
    # This guarantees EVERY step runs exactly inside DockKubeDesktop
    defaults:
      run:
        working-directory: ./DockKubeDesktop
    
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Build Windows Executable
        run: |
          pip install pyinstaller
          
          # Ignore the .spec file and build directly from your app.py file
          # --windowed hides the background console terminal for GUI apps
          pyinstaller --onefile --windowed app.py
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: Latest Desktop Build
          # When building from app.py, the output defaults to the 'dist' folder
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
