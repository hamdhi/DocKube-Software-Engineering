name: Build Kotlin Android App

on:
  push:
    branches:
      - main
    paths:
      - 'DockKubeAndroid/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      # This forces GitHub to print every folder it successfully downloaded
      - name: DEBUG - List all files downloaded from GitHub
        run: ls -la
        
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build Debug APK
        # We apply the folder path only to this step now
        working-directory: ./DockKubeAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-latest
          name: Latest Android Build
          # We must include the folder name here since we removed the global lock
          files: DockKubeAndroid/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
