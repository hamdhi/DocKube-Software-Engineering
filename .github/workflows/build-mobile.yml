name: Build Kotlin Android App

on:
  push:
    branches:
      - main
    paths:
      - 'DocKubeAndroid/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./DocKubeAndroid

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      - name: Stamp the release body
        run: |
          set -e
          VERSION=$(grep -m1 '^ *versionName *= *"' app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          CODE=$(grep -m1 '^ *versionCode *= *[0-9]*' app/build.gradle.kts | grep -o '[0-9]*')
          if [ -z "$VERSION" ]; then echo "Could not read versionName"; exit 1; fi
          echo "DocKube-Android v$VERSION (versionCode $CODE)" > release_body.txt
          cat release_body.txt

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Copy the APK into the mobile dist folder
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          echo "DocKubeAndroid/dist now holds:"
          ls -l dist

      - name: Delete stale release assets
        run: |
          set -e
          release_id=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/hamdhi/DocKube-Software-Engineering/releases/tags/android-latest" | python -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "release_id=$release_id"
          # Delete both the stale debug APK and any previous release APK:
          # the upload API returns 422 when an asset with the same name exists.
          # Runs after the build so a failed build never leaves the release
          # with no downloadable APK.
          asset_ids=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/hamdhi/DocKube-Software-Engineering/releases/$release_id/assets" | python -c "import sys,json; assets=json.load(sys.stdin); [print(a['id']) for a in assets if a['name'] in ('app-debug.apk','app-release.apk')]")
          for asset_id in $asset_ids; do
            echo "Deleting asset_id=$asset_id"
            curl -fsSL -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/hamdhi/DocKube-Software-Engineering/releases/assets/$asset_id"
            echo "Deleted asset $asset_id"
          done
          echo "Stale assets cleaned"

      - name: Upload Release APK and stamp body
        env:
          # The file published is the one sitting in the mobile dist folder,
          # so the release asset and DocKubeAndroid/dist are always identical.
          APK: dist/app-release.apk
        run: |
          set -e
          apk_size=$(stat -c%s "$APK")
          echo "apk_size=$apk_size"
          release_id=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/hamdhi/DocKube-Software-Engineering/releases/tags/android-latest" | python -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "release_id=$release_id"
          # Update body (use a file to avoid shell mangling of the body).
          # PATCH only exists on /releases/{id}; the /releases/tags/{tag}
          # form is GET-only and returns 404 for PATCH. The API also
          # requires a JSON payload -- raw text/plain is rejected with 400.
          python -c "import json; open('publish_body.json','w',encoding='utf-8').write(json.dumps({'body': open('release_body.txt',encoding='utf-8').read()}))"
          curl -fsSL -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @"publish_body.json" \
            "https://api.github.com/repos/hamdhi/DocKube-Software-Engineering/releases/$release_id" \
            -o /dev/null
          echo "Body updated"
          # Upload APK
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/hamdhi/DocKube-Software-Engineering/releases/$release_id/assets?name=app-release.apk" \
            -o /dev/null
          echo "APK uploaded"

      - name: Commit the dist folder back to the repository
        # Never fail the release over a sync push: a rejected push (user
        # pushed meanwhile, branch protection) leaves only the repo copy of
        # dist stale while the published asset stays correct.
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DocKubeAndroid/dist/app-release.apk
          if git diff --cached --quiet; then
            echo "dist/app-release.apk is already up to date"
          else
            git commit -m "Publish android-latest app-release.apk into DocKubeAndroid/dist [skip ci]"
            git push
          fi